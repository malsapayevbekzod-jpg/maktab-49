<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="49-sonli maktab rasmiy logotipi">
  <defs>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#2747a8"/>
      <stop offset="55%" stop-color="#182b6e"/>
      <stop offset="100%" stop-color="#0f1b47"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0ecff"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1332" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tashqi qalqon (Shield) -->
  <path
    d="M80 8 L138 26 C142 27.3 144 30.8 144 35 V78 C144 114 117 139 80 152 C43 139 16 114 16 78 V35 C16 30.8 18 27.3 22 26 Z"
    fill="url(#shieldBg)"
    stroke="url(#goldGrad)"
    stroke-width="4.5"
    filter="url(#softShadow)"
  />

  <!-- Ichki nozik oltin chiziq -->
  <path
    d="M80 16 L132 32.2 C134.8 33.1 136.5 35.6 136.5 38.6 V77.5 C136.5 109.2 112.5 131.6 80 143.5 C47.5 131.6 23.5 109.2 23.5 77.5 V38.6 C23.5 35.6 25.2 33.1 28 32.2 Z"
    fill="none"
    stroke="#fde68a"
    stroke-opacity="0.45"
    stroke-width="1.4"
  />

  <!-- Milliy 8 qirrali yulduz va quyosh nuri (yuqori markaz) -->
  <g transform="translate(80, 34)" opacity="0.95">
    <polygon points="0,-11 2.8,-4 10,-4 4.5,0.6 6.8,8 0,3.8 -6.8,8 -4.5,0.6 -10,-4 -2.8,-4" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Zaytun / dafna yaproqlari (chap va o'ng) -->
  <g fill="none" stroke="url(#emeraldGrad)" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
    <path d="M44 112 C32 96 31 72 41 52"/>
    <path d="M116 112 C128 96 129 72 119 52"/>
  </g>
  <g fill="url(#emeraldGrad)" opacity="0.92">
    <!-- Chap yaproqlar -->
    <ellipse cx="35" cy="96" rx="5.5" ry="2.4" transform="rotate(-38 35 96)"/>
    <ellipse cx="32" cy="83" rx="5.5" ry="2.4" transform="rotate(-22 32 83)"/>
    <ellipse cx="34" cy="69" rx="5.5" ry="2.4" transform="rotate(-8 34 69)"/>
    <ellipse cx="39" cy="57" rx="5" ry="2.2" transform="rotate(14 39 57)"/>
    <!-- O'ng yaproqlar -->
    <ellipse cx="125" cy="96" rx="5.5" ry="2.4" transform="rotate(38 125 96)"/>
    <ellipse cx="128" cy="83" rx="5.5" ry="2.4" transform="rotate(22 128 83)"/>
    <ellipse cx="126" cy="69" rx="5.5" ry="2.4" transform="rotate(8 126 69)"/>
    <ellipse cx="121" cy="57" rx="5" ry="2.2" transform="rotate(-14 121 57)"/>
  </g>

  <!-- Markaziy yirik "49" raqami -->
  <text
    x="80"
    y="90"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="48"
    font-weight="900"
    letter-spacing="-2"
    fill="url(#numGrad)"
    stroke="#0f1b47"
    stroke-width="1"
  >49</text>

  <!-- Ochiq bilim kitobi -->
  <g transform="translate(80, 108)">
    <path d="M0 3 C-9 -4 -20 -4 -28 0 V13 C-20 9 -9 9 0 16 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M0 3 C9 -4 20 -4 28 0 V13 C20 9 9 9 0 16 Z" fill="#dbeafe" fill-opacity="0.95"/>
    <line x1="0" y1="3" x2="0" y2="16" stroke="#1d2f6f" stroke-width="1.6"/>
  </g>

  <!-- Pastki lenta: MAKTAB • 1988 -->
  <rect x="38" y="124" width="84" height="16" rx="8" fill="url(#goldGrad)"/>
  <text
    x="80"
    y="135.5"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9.5"
    font-weight="800"
    letter-spacing="0.8"
    fill="#131f4d"
  >MAKTAB • 1988</text>
</svg>
